name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which the pinned Playwright (1.56.1) can't install Chromium on.
    # Move this on together with @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
